[project]
name = "notification-micro-service"
version = "0.1.0"
description = "Notification micro-service for reset password"
authors = [
    {name = "Nino Ghonghadze",email = "nghonghadze07@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pika (>=1.4.1,<2.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "boto3 (>=1.43.16,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
